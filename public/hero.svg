  <circle cx="240" cy="238" r="6" fill="#F4F7FB" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#16181D">
    <text x="40" y="424" font-size="17" letter-spacing="2.6" font-weight="600">MW AI CLUB</text>
    <text x="40" y="446" font-size="11" letter-spacing="1.2" fill="#5C6675">MINGWAN SCHOOL</text>
