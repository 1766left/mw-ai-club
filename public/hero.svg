      <path d="M40 0H0V40" fill="none" stroke="#E3E9F2" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#0087FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0087FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="480" height="480" fill="#F4F7FB" />
  <rect width="480" height="480" fill="url(#grid)" />
