    <line x1="240" y1="238" x2="352" y2="140" />
    <line x1="240" y1="238" x2="150" y2="330" />
    <line x1="240" y1="238" x2="330" y2="336" />
    <line x1="240" y1="238" x2="240" y2="360" />
    <line x1="126" y1="158" x2="352" y2="140" stroke-dasharray="4 6" opacity="0.5" />
    <line x1="150" y1="330" x2="330" y2="336" stroke-dasharray="4 6" opacity="0.5" />
  </g>

  <g fill="none" stroke="#0087FF" stroke-width="2.5">
