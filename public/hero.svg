  <circle cx="352" cy="140" r="10" fill="#FF8C0F" stroke="none" />
  <circle cx="330" cy="336" r="10" fill="#14D7CD" stroke="none" />

  <circle cx="240" cy="238" r="34" fill="#0087FF" fill-opacity="0.12" />
